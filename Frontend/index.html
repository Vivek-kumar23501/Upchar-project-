<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: edge-to-edge on iPhone notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>Upchar — Intelligent Healthcare Platform</title>
    <meta name="description" content="Upchar bridges patients, ASHA workers, pharmacies and specialists with AI diagnosis, live teleconsultation and real-time medicine tracking." />

    <!-- PWA / Installable -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#004d37" />

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Upchar" />

    <!-- Android / PWA splash -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Upchar" />

    <!-- Google Fonts: DM Sans + Playfair Display + Inter (app UI font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Material Symbols Rounded (filled) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
