<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swasthya Rakshak - AI Health Assistant</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 90vh;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= HEADER ================= */

  .chat-header {
    background: linear-gradient(135deg, #16a34a, #0d9488);
    color: white;
    padding: 18px 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chat-header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  .chat-header p {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 3px;
  }

  .new-chat-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.35);
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }

  .new-chat-btn:hover {
    background: rgba(255,255,255,0.3);
  }

  /* ================= CHAT MESSAGES ================= */

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f9fb;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: #16a34a;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: white;
    color: #1f2937;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }

  /* ================= RESULT CARD ================= */

  .result-card {
    align-self: flex-start;
    max-width: 90%;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 14px 16px;
    font-size: 14px;
  }

  .result-card h3 {
    font-size: 15px;
    color: #111827;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .badge.low {
    background: #dcfce7;
    color: #166534;
  }

  .badge.medium {
    background: #fef9c3;
    color: #854d0e;
  }

  .badge.high {
    background: #fee2e2;
    color: #991b1b;
  }

  .badge.unknown {
    background: #e5e7eb;
    color: #374151;
  }

  .result-card .row {
    margin-bottom: 6px;
  }

  .result-card .label {
    font-weight: 600;
    color: #374151;
  }

  .result-card ul {
    margin: 4px 0 0 18px;
  }

  /* ================= ANIMATION ================= */

  .fade-in {
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #374151;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  /* ================= BUTTONS ================= */

  .appointment-btn {
    margin-top: 10px;
    width: 100%;
    background: #dc2626;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .appointment-btn:hover {
    background: #b91c1c;
  }

  .speak-btn {
    margin-top: 8px;
    background: none;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 5px 10px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .speak-btn:hover {
    background: #f3f4f6;
  }

  .speak-btn.speaking {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
  }

  /* ================= TYPING / ERROR ================= */

  .typing {
    align-self: flex-start;
    font-size: 13px;
    color: #6b7280;
    padding: 6px 14px;
  }

  .mic-status {
    align-self: center;
    font-size: 12px;
    color: #16a34a;
    font-style: italic;
    padding: 4px 10px;
  }

  .transcript-note {
    font-size: 11px;
    color: #6b7280;
    font-style: italic;
    margin-bottom: 4px;
  }

  .error-msg {
    align-self: flex-start;
    background: #fee2e2;
    color: #991b1b;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    max-width: 85%;
  }

  /* ================= INPUT ================= */

  .chat-input-area {
    display: flex;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
    background: white;
    gap: 8px;
    align-items: center;
  }

  .chat-input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
  }

  .chat-input-area input:focus {
    border-color: #16a34a;
  }

  .chat-input-area button {
    background: #16a34a;
    color: white;
    border: none;
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }

  .chat-input-area button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  #micBtn {
    background: #0d9488;
  }

  #micBtn.recording {
    background: #dc2626;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(220,38,38,0.5);
    }

    70% {
      box-shadow: 0 0 0 10px rgba(220,38,38,0);
    }

    100% {
      box-shadow: 0 0 0 0 rgba(220,38,38,0);
    }
  }

  /* ================= SESSION INFO ================= */

  .session-info {
    font-size: 10px;
    color: #9ca3af;
    text-align: center;
    padding: 3px;
    background: #f7f9fb;
  }
</style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="header-top">

      <div>
        <h1>Swasthya Rakshak</h1>
        <p>AI Health Assistant — describe your symptoms</p>
      </div>

      <button
        type="button"
        class="new-chat-btn"
        id="newChatBtn"
      >
        + New Chat
      </button>

    </div>
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages" id="chatMessages">

    <div class="msg bot">
      Namaste! Apne symptoms bataiye (type karke ya 🎤 dabakar kisi bhi bhasha me bolke), ya koi bhi health-related sawal poochiye.
    </div>

  </div>

  <div class="session-info">
    Session: <span id="sessionDisplay"></span>
  </div>

  <!-- INPUT -->
  <div class="chat-input-area">

    <button
      type="button"
      id="micBtn"
      title="Bolke poocho"
    >
      🎤
    </button>

    <input
      type="text"
      id="userInput"
      placeholder="e.g. itching, skin rash, high fever"
      autocomplete="off"
      autofocus
    />

    <button
      type="button"
      id="sendBtn"
    >
      ➤
    </button>

  </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

  /* ============================================================
     API CONFIGURATION
  ============================================================ */

  const RAG_API_BASE = "http://localhost:5002";

  const NODE_API_BASE = "http://localhost:8080";


  const TEXT_API_URL = `${RAG_API_BASE}/rag-chat`;
  const VOICE_API_URL = `${RAG_API_BASE}/voice-chat`;

  const SAVE_CHAT_URL = `${NODE_API_BASE}/chat/save`;
  const CHAT_HISTORY_URL = `${NODE_API_BASE}/chat/history`;
  const CHAT_SESSIONS_URL = `${NODE_API_BASE}/chat/sessions`;


  /* ============================================================
     DOM
  ============================================================ */

  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const newChatBtn = document.getElementById("newChatBtn");
  const sessionDisplay = document.getElementById("sessionDisplay");


  /* ============================================================
     AUTH TOKEN
  ============================================================ */

  function getToken() {

    const token = localStorage.getItem("token");

    if (!token) {
      console.warn("No authentication token found.");
    }

    return token;
  }


  function getAuthHeaders() {

    const token = getToken();

    return {
      "Content-Type": "application/json",
      ...(token
        ? {
            "Authorization": `Bearer ${token}`
          }
        : {})
    };

  }


  /* ============================================================
     SESSION MANAGEMENT
  ============================================================ */

  function generateSessionId() {

    return (
      "chat_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 10)
    );

  }


  let sessionId =
    localStorage.getItem("activeChatSessionId") ||
    generateSessionId();


  localStorage.setItem(
    "activeChatSessionId",
    sessionId
  );


  sessionDisplay.textContent = sessionId;


  /* ============================================================
     NEW CHAT
  ============================================================ */

  newChatBtn.addEventListener("click", function () {

    sessionId = generateSessionId();

    localStorage.setItem(
      "activeChatSessionId",
      sessionId
    );

    sessionDisplay.textContent = sessionId;

    chatMessages.innerHTML = "";

    addBotWelcomeMessage();

    userInput.value = "";
    userInput.focus();

  });


  function addBotWelcomeMessage() {

    const div = document.createElement("div");

    div.className = "msg bot";

    div.textContent =
      "Namaste! Apne symptoms bataiye (type karke ya 🎤 dabakar kisi bhi bhasha me bolke), ya koi bhi health-related sawal poochiye.";

    chatMessages.appendChild(div);

    scrollToBottom();

  }


  /* ============================================================
     SAVE CHAT MESSAGE TO NODE BACKEND
  ============================================================ */

  async function saveChatMessage({
    role,
    message,
    type = null,
    responseData = null,
    language = null,
    fromVoice = false
  }) {

    const token = getToken();

    if (!token) {
      console.warn(
        "Chat not saved because token is missing."
      );
      return null;
    }


    try {

      const response = await fetch(
        SAVE_CHAT_URL,
        {
          method: "POST",

          headers: getAuthHeaders(),

          body: JSON.stringify({

            sessionId,

            role,

            message,

            type,

            responseData,

            language,

            fromVoice

          })

        }
      );


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        console.error(
          "Save chat failed:",
          data
        );

        return null;
      }


      console.log(
        "Chat saved successfully:",
        data
      );


      return data.chat || data;

    } catch (error) {

      console.error(
        "Save chat network error:",
        error
      );

      return null;
    }

  }


  /* ============================================================
     LOAD CURRENT SESSION HISTORY
  ============================================================ */

  async function loadChatHistory() {

    const token = getToken();

    if (!token) {

      console.warn(
        "No token. Starting fresh chat."
      );

      return;

    }


    try {

      const response = await fetch(
        `${CHAT_HISTORY_URL}/${encodeURIComponent(sessionId)}`,
        {
          method: "GET",
          headers: {
            "Authorization":
              `Bearer ${token}`
          }
        }
      );


      if (response.status === 401) {

        console.error(
          "Authentication expired."
        );

        /* FIX: clear the stale/invalid token so the user
           doesn't stay stuck retrying with a dead token
           on every reload. */
        localStorage.removeItem("token");

        addErrorMessage(
          "Your login session has expired. Please login again."
        );

        return;

      }


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        console.error(
          "History loading failed:",
          data
        );

        return;
      }


      const messages =
        data.messages || [];


      if (messages.length === 0) {

        return;
      }


      chatMessages.innerHTML = "";


      for (const chat of messages) {

        if (chat.role === "user") {

          addUserMessage(
            chat.message,
            !!chat.fromVoice,
            false
          );

        }

        else if (chat.role === "bot") {

          if (
            chat.responseData &&
            typeof chat.responseData === "object"
          ) {

            const result =
              chat.responseData;


            if (chat.type === "info") {

              await addInfoMessage(
                result,
                false,
                false
              );

            } else {

              await addResultCard(
                result,
                false,
                false
              );

            }

          }

          else {

            addSimpleBotMessage(
              chat.message,
              false
            );

          }

        }

      }


      scrollToBottom();


    } catch (error) {

      console.error(
        "Could not load chat history:",
        error
      );

    }

  }


  /* ============================================================
     LOAD ALL SESSIONS
  ============================================================ */

  async function loadChatSessions() {

    const token = getToken();

    if (!token) return [];


    try {

      const response = await fetch(
        CHAT_SESSIONS_URL,
        {
          method: "GET",

          headers: {
            "Authorization":
              `Bearer ${token}`
          }
        }
      );


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {

        console.error(
          "Session loading failed:",
          data
        );

        return [];

      }


      console.log(
        "Available chat sessions:",
        data.sessions || []
      );


      return data.sessions || [];


    } catch (error) {

      console.error(
        "Session request failed:",
        error
      );

      return [];

    }

  }


  /* ============================================================
     TEXT TO SPEECH
  ============================================================ */

  const synth =
    window.speechSynthesis;


  const LANG_TO_SPEECH_TAG = {

    "en": "en-IN",
    "english": "en-IN",

    "hi": "hi-IN",
    "hindi": "hi-IN",

    "bn": "bn-IN",
    "bengali": "bn-IN",

    "te": "te-IN",
    "telugu": "te-IN",

    "mr": "mr-IN",
    "marathi": "mr-IN",

    "ta": "ta-IN",
    "tamil": "ta-IN",

    "gu": "gu-IN",
    "gujarati": "gu-IN",

    "kn": "kn-IN",
    "kannada": "kn-IN",

    "ml": "ml-IN",
    "malayalam": "ml-IN",

    "pa": "pa-IN",
    "punjabi": "pa-IN",

    "ur": "ur-IN",
    "urdu": "ur-IN",

    "ne": "ne-NP",
    "nepali": "ne-NP",

    "bhojpuri": "hi-IN"

  };


  function resolveSpeechLang(
    languageField,
    languageCode
  ) {

    const codeKey =
      (languageCode || "").toLowerCase();

    const nameKey =
      (languageField || "").toLowerCase();

    return (
      LANG_TO_SPEECH_TAG[codeKey] ||
      LANG_TO_SPEECH_TAG[nameKey] ||
      "en-IN"
    );

  }


  function speakText(
    text,
    languageField,
    languageCode,
    buttonEl
  ) {

    if (!synth || !text) return;

    synth.cancel();


    const chunks = text

      .split(/(?<=[।.?!\n])\s+/)

      .map(chunk => chunk.trim())

      .filter(
        chunk => chunk.length > 0
      );


    if (chunks.length === 0) return;


    const langTag =
      resolveSpeechLang(
        languageField,
        languageCode
      );


    let currentIndex = 0;


    if (buttonEl) {

      buttonEl.classList.add(
        "speaking"
      );

    }


    function speakNextChunk() {

      if (
        currentIndex >=
        chunks.length
      ) {

        if (buttonEl) {

          buttonEl.classList.remove(
            "speaking"
          );

        }

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          chunks[currentIndex]
        );


      utterance.lang =
        langTag;

      utterance.rate =
        0.95;


      utterance.onend =
        function () {

          currentIndex++;

          speakNextChunk();

        };


      utterance.onerror =
        function () {

          currentIndex++;

          speakNextChunk();

        };


      synth.speak(
        utterance
      );

    }


    speakNextChunk();

  }


  function addSpeakButton(
    container,
    text,
    languageField,
    languageCode
  ) {

    if (!synth) return;


    const btn =
      document.createElement(
        "button"
      );


    btn.type = "button";

    btn.className =
      "speak-btn fade-in";

    btn.textContent =
      "🔊 Suno";


    btn.addEventListener(
      "click",
      function (e) {

        e.preventDefault();

        speakText(
          text,
          languageField,
          languageCode,
          btn
        );

      }
    );


    container.appendChild(btn);

  }


  /* ============================================================
     VOICE RECORDING
  ============================================================ */

  let mediaRecorder = null;

  let audioChunks = [];

  let isRecording = false;

  let mediaStream = null;


  const hasMic =
    !!(
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
    );


  if (!hasMic) {

    micBtn.disabled = true;

    micBtn.style.opacity = "0.4";

  }


  micBtn.addEventListener(
    "click",
    async function (e) {

      e.preventDefault();


      if (!hasMic) return;


      if (isRecording) {

        stopRecording();

        return;

      }


      try {

        mediaStream =
          await navigator
            .mediaDevices
            .getUserMedia({
              audio: true
            });

      } catch (err) {

        addErrorMessage(
          "Mic permission denied ya mic available nahi hai."
        );

        return;

      }


      audioChunks = [];


      const mimeType =
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
          ? "audio/webm"
          : (
              MediaRecorder.isTypeSupported(
                "audio/mp4"
              )
                ? "audio/mp4"
                : ""
            );


      mediaRecorder =
        mimeType
          ? new MediaRecorder(
              mediaStream,
              {
                mimeType
              }
            )
          : new MediaRecorder(
              mediaStream
            );


      mediaRecorder.ondataavailable =
        function (event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function () {

          mediaStream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          sendVoiceMessage(
            blob
          );

        };


      mediaRecorder.start();


      isRecording = true;


      micBtn.classList.add(
        "recording"
      );

      micBtn.textContent =
        "⏹";


      addMicStatus(
        "Sun raha hoon... bolo, phir ⏹ dabao"
      );

    }
  );


  function stopRecording() {

    if (
      mediaRecorder &&
      isRecording
    ) {

      mediaRecorder.stop();

    }


    isRecording = false;


    micBtn.classList.remove(
      "recording"
    );

    micBtn.textContent =
      "🎤";


    removeMicStatus();

  }


  function addMicStatus(text) {

    removeMicStatus();


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "mic-status";

    div.id =
      "micStatus";

    div.textContent =
      text;


    chatMessages.appendChild(
      div
    );


    scrollToBottom();

  }


  function removeMicStatus() {

    const el =
      document.getElementById(
        "micStatus"
      );


    if (el) el.remove();

  }


  /* ============================================================
     SEND VOICE MESSAGE
  ============================================================ */

  async function sendVoiceMessage(
    audioBlob
  ) {

    sendBtn.disabled = true;

    micBtn.disabled = true;


    addTypingIndicator(
      "Sun kar samajh raha hoon..."
    );


    try {

      const formData =
        new FormData();


      formData.append(
        "audio",
        audioBlob,
        "voice.webm"
      );


      const response =
        await fetch(
          VOICE_API_URL,
          {
            method: "POST",
            body: formData
          }
        );


      removeTypingIndicator();


      if (!response.ok) {

        const errData =
          await response
            .json()
            .catch(() => ({}));


        addErrorMessage(
          "Error: " +
          (
            errData.error ||
            "Voice processing failed."
          )
        );

        return;

      }


      const result =
        await response.json();


      if (result.error) {

        addErrorMessage(
          "Error: " +
          result.error
        );

        return;

      }


      /* SAVE USER VOICE MESSAGE */

      if (result.transcript) {

        addUserMessage(
          result.transcript,
          true,
          true
        );


        await saveChatMessage({

          role: "user",

          message:
            result.transcript,

          type: "voice",

          responseData: null,

          language:
            result.language ||
            result.language_code ||
            null,

          fromVoice: true

        });

      }


      /* SHOW BOT RESPONSE */

      if (result.type === "info") {

        await addInfoMessage(
          result,
          true,
          true
        );

      }

      else {

        await addResultCard(
          result,
          true,
          true
        );

      }


    } catch (err) {

      removeTypingIndicator();


      console.error(
        "Voice error:",
        err
      );


      addErrorMessage(
        "Could not connect to Flask backend."
      );

    } finally {

      sendBtn.disabled = false;

      micBtn.disabled = false;

    }

  }


  /* ============================================================
     CHAT UI HELPERS
  ============================================================ */

  sendBtn.addEventListener(
    "click",
    function (e) {

      e.preventDefault();

      sendMessage();

    }
  );


  userInput.addEventListener(
    "keydown",
    function (e) {

      if (e.key === "Enter") {

        e.preventDefault();

        e.stopPropagation();

        sendMessage();

      }

    }
  );


  function addUserMessage(
    text,
    fromVoice = false,
    saveMessage = true
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "msg user";


    if (fromVoice) {

      const note =
        document.createElement(
          "div"
        );


      note.className =
        "transcript-note";


      note.style.color =
        "rgba(255,255,255,0.8)";


      note.textContent =
        "🎤 (voice)";


      div.appendChild(
        note
      );

    }


    const textSpan =
      document.createElement(
        "span"
      );


    textSpan.textContent =
      text;


    div.appendChild(
      textSpan
    );


    chatMessages.appendChild(
      div
    );


    scrollToBottom();


    if (
      saveMessage &&
      text
    ) {

      saveChatMessage({

        role: "user",

        message: text,

        type:
          fromVoice
            ? "voice"
            : "text",

        responseData: null,

        language: null,

        fromVoice

      });

    }

  }


  function addSimpleBotMessage(
    text,
    saveMessage = true
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "msg bot";


    div.textContent =
      text || "";


    chatMessages.appendChild(
      div
    );


    scrollToBottom();


    if (
      saveMessage &&
      text
    ) {

      saveChatMessage({

        role: "bot",

        message: text,

        type: "info",

        responseData: null,

        language: null,

        fromVoice: false

      });

    }

  }


  function addTypingIndicator(
    label
  ) {

    removeTypingIndicator();


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "typing";


    div.id =
      "typingIndicator";


    div.textContent =
      label || "Analyzing...";


    chatMessages.appendChild(
      div
    );


    scrollToBottom();

  }


  function removeTypingIndicator() {

    const el =
      document.getElementById(
        "typingIndicator"
      );


    if (el) el.remove();

  }


  function addErrorMessage(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "error-msg";


    div.textContent =
      text;


    chatMessages.appendChild(
      div
    );


    scrollToBottom();

  }


  function escapeHtml(str) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      str || "";


    return div.innerHTML;

  }


  function scrollToBottom() {

    chatMessages.scrollTop =
      chatMessages.scrollHeight;

  }


  function typeWords(
    element,
    text,
    speed = 55
  ) {

    return new Promise(
      (resolve) => {

        const words =
          (text || "").split(" ");


        let i = 0;


        const cursor =
          document.createElement(
            "span"
          );


        cursor.className =
          "cursor";


        function step() {

          if (
            i < words.length
          ) {

            element.textContent =
              words
                .slice(0, i + 1)
                .join(" ");


            element.appendChild(
              cursor
            );


            i++;


            scrollToBottom();


            setTimeout(
              step,
              speed
            );

          }

          else {

            cursor.remove();

            resolve();

          }

        }


        step();

      }
    );

  }


  function sleep(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }


  /* ============================================================
     INFO RESPONSE
  ============================================================ */

  async function addInfoMessage(
    result,
    speak = false,
    saveMessage = true
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "msg bot";


    chatMessages.appendChild(
      div
    );


    const answerText =
      result.answer ||
      "No answer available.";


    await typeWords(
      div,
      answerText,
      45
    );


    addSpeakButton(
      div,
      answerText,
      result.language,
      result.language_code
    );


    if (speak) {

      speakText(
        answerText,
        result.language,
        result.language_code,
        null
      );

    }


    if (saveMessage) {

      await saveChatMessage({

        role: "bot",

        message:
          answerText,

        type: "info",

        responseData:
          result,

        language:
          result.language ||
          result.language_code ||
          null,

        fromVoice: speak

      });

    }

  }


  /* ============================================================
     PREDICTION RESULT CARD
  ============================================================ */

  async function addResultCard(
    result,
    speak = false,
    saveMessage = true
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "result-card";


    chatMessages.appendChild(
      card
    );


    const severity =
      (
        result.severity ||
        "unknown"
      ).toLowerCase();


    const precautions =
      Array.isArray(
        result.precautions
      )
        ? result.precautions
        : [];


    const labels =
      result.ui_labels || {};


    const severityDisplay =
      labels[
        `severity_${severity}`
      ] || severity;


    const confidenceLabel =
      labels.confidence_label ||
      "Confidence";


    const reasoningLabel =
      labels.reasoning_label ||
      "Reasoning";


    const precautionsLabel =
      labels.precautions_label ||
      "Precautions";


    const appointmentLabel =
      labels.appointment_button ||
      "Book Appointment Now";


    const badgeWrap =
      document.createElement(
        "div"
      );


    badgeWrap.className =
      "fade-in";


    badgeWrap.innerHTML = `

      <span class="badge ${escapeHtml(severity)}">
        ${escapeHtml(severityDisplay)}
      </span>

      <h3>
        ${escapeHtml(
          result.predicted_disease ||
          "Unclear"
        )}
      </h3>

      <div class="row">
        <span class="label">
          ${escapeHtml(confidenceLabel)}:
        </span>

        ${escapeHtml(
          result.confidence ||
          "N/A"
        )}
      </div>

    `;


    card.appendChild(
      badgeWrap
    );


    scrollToBottom();


    await sleep(200);


    const reasoningRow =
      document.createElement(
        "div"
      );


    reasoningRow.className =
      "row fade-in";


    reasoningRow.innerHTML =
      `<span class="label">
        ${escapeHtml(reasoningLabel)}:
      </span>`;


    const reasoningText =
      document.createElement(
        "span"
      );


    reasoningRow.appendChild(
      reasoningText
    );


    card.appendChild(
      reasoningRow
    );


    const reasoningFullText =
      result.reasoning ||
      "No reasoning available.";


    await typeWords(
      reasoningText,
      reasoningFullText,
      55
    );


    if (
      precautions.length > 0
    ) {

      const precRow =
        document.createElement(
          "div"
        );


      precRow.className =
        "row fade-in";


      precRow.innerHTML =
        `<span class="label">
          ${escapeHtml(precautionsLabel)}:
        </span>
        <ul>
          ${precautions
            .map(
              p =>
                `<li>${escapeHtml(p)}</li>`
            )
            .join("")}
        </ul>`;


      card.appendChild(
        precRow
      );


      scrollToBottom();


      await sleep(200);

    }


    if (
      result.recommend_appointment
    ) {

      const btn =
        document.createElement(
          "button"
        );


      btn.type =
        "button";


      btn.className =
        "appointment-btn fade-in";


      btn.textContent =
        appointmentLabel;


      btn.addEventListener(
        "click",
        function (e) {

          e.preventDefault();


          bookAppointment(
            result.predicted_disease ||
            "",
            severity
          );

        }
      );


      card.appendChild(
        btn
      );


      scrollToBottom();

    }


    const precautionsSpeech =
      precautions.length > 0
        ? (
            ". " +
            precautionsLabel +
            ": " +
            precautions.join(", ")
          )
        : "";


    const speechText =
      `${
        result.predicted_disease || ""
      }. ${
        reasoningFullText
      }${
        precautionsSpeech
      }`;


    addSpeakButton(
      card,
      speechText,
      result.language,
      result.language_code
    );


    if (speak) {

      speakText(
        speechText,
        result.language,
        result.language_code,
        null
      );

    }


    if (saveMessage) {

      await saveChatMessage({

        role: "bot",

        message:
          result.predicted_disease ||
          reasoningFullText ||
          "Health prediction result",

        type: "prediction",

        responseData:
          result,

        language:
          result.language ||
          result.language_code ||
          null,

        fromVoice: speak

      });

    }

  }


  /* ============================================================
     SEND TEXT MESSAGE
  ============================================================ */

  async function sendMessage() {

    const text =
      userInput.value.trim();


    if (!text) return;


    addUserMessage(
      text,
      false,
      true
    );


    userInput.value = "";

    sendBtn.disabled = true;


    addTypingIndicator();


    try {

      const response =
        await fetch(
          TEXT_API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              symptoms: text
            })
          }
        );


      removeTypingIndicator();


      if (!response.ok) {

        const errData =
          await response
            .json()
            .catch(() => ({}));


        addErrorMessage(
          "Error: " +
          (
            errData.error ||
            "Something went wrong."
          )
        );


        return;

      }


      const result =
        await response.json();


      if (result.error) {

        addErrorMessage(
          "Error: " +
          result.error
        );


        return;

      }


      if (
        result.type === "info"
      ) {

        await addInfoMessage(
          result,
          false,
          true
        );

      }

      else {

        await addResultCard(
          result,
          false,
          true
        );

      }


    } catch (err) {

      removeTypingIndicator();


      console.error(
        "Text chat error:",
        err
      );


      addErrorMessage(
        "Could not connect to Flask backend. Make sure it is running on port 5002."
      );

    } finally {

      sendBtn.disabled =
        false;

      userInput.focus();

    }

  }


  /* ============================================================
     APPOINTMENT
  ============================================================ */

  function bookAppointment(
    disease,
    severity
  ) {

    alert(
      "Appointment booking triggered for: " +
      disease +
      " (severity: " +
      severity +
      ")"
    );

  }


  /* ============================================================
     INITIALIZATION
  ============================================================ */

  async function initializeChat() {

    const token =
      getToken();


    if (!token) {

      addErrorMessage(
        "Please login first to use chat history."
      );

      return;

    }


    console.log(
      "Current chat session:",
      sessionId
    );


    await loadChatHistory();


    await loadChatSessions();


    userInput.focus();

  }


  initializeChat();

});

</script>
